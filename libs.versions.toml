[versions]

hummus = "0.0.3"

kotlin = "2.2.21"
ksp = "2.3.2"
agp = "8.12.3"

javax-inject = "1"
kotlinx-serialization = "1.10.0"
kotlinx-coroutines = "1.10.1"
jetbrain-immutable = "0.3.7"
jetbrain-coroutines = "1.10.1"
kotlinx-atomicfu = "0.29.0"
kotlinx-datetime = "0.7.1"

compose = "1.10.0"
compose-m = "1.7.3"
compose-m3 = "1.9.0"
compose-shimmer = "1.3.3"
compose-multiplatform = "1.10.0"
compose-nav = "1.5.0"
compose-m3-adaptive = "1.3.0-alpha06"

kotlinpoet = "2.0.0"
stone = "2.1.0_lc"

picocli = "4.7.5"
ktor = "3.1.0"

junit = "6.0.0"
junit-launcher = "6.0.0"
testing-compile = "0.23.0"


[libraries]


kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jetbrain-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "jetbrain-immutable" }
jetbrain-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "jetbrain-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# https://mvnrepository.com/artifact/javax.inject/javax.inject
java-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javax-inject" }

kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "kotlinx-atomicfu" }

ksp = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }

kotlinpoet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { group = "com.squareup", name = "kotlinpoet-ksp", version.ref = "kotlinpoet" }

kotlin-compiler = { group = "org.jetbrains.kotlin", name = "kotlin-compiler-embeddable", version.ref = "kotlin" }

picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }

ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }

#  Common compose
compose-contrainlayout = { module = "tech.annexflow.compose:constraintlayout-compose-multiplatform", version = "0.7.0" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose" }
compose-animation-graphics = { module = "org.jetbrains.compose.animation:animation-graphics", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-runtime-saveable = { module = "org.jetbrains.compose.runtime:runtime-saveable", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
compose-util = { module = "org.jetbrains.compose.ui:ui-util", version.ref = "compose" }
compose-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }

compose-m-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-m" }
compose-m3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-m3" }
compose-m3-adaptive-nav = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "compose-m3" }

compose-m3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-m3-adaptive" }
compose-m3-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "compose-m3-adaptive" }
compose-m3-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "compose-m3-adaptive" }

# shimmer compose https://github.com/valentinilk/compose-shimmer
compose-shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version.ref = "compose-shimmer" }


jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
jupiter-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-launcher" }

testing-kapt-compile = { group = "com.google.testing.compile", name = "compile-testing", version.ref = "testing-compile" }

# https://github.com/klee0kai/stone
stone-kotlin = { group = "com.github.klee0kai.stone", name = "stone_multiplatform", version.ref = "stone" }
stone-ksp = { group = "com.github.klee0kai.stone", name = "stone_ksp", version.ref = "stone" }
stone-ref = { group = "com.github.klee0kai.stone", name = "weakref_multiplatform", version.ref = "stone" }
stone-inject = { group = "com.github.klee0kai.stone", name = "inject_multiplatform", version.ref = "stone" }

[bundles]

kotlin = ["kotlinx-coroutines", "kotlinx-datetime", "kotlinx-atomicfu"]
kotlinpoet = ["kotlinpoet", "kotlinpoet-ksp"]
junit = ["jupiter-api", "jupiter-engine", "jupiter-launcher"]

compose = [
    "compose-foundation", "compose-runtime", "compose-runtime-saveable", "compose-ui", "compose-resources",
    "compose-animation", "compose-animation-graphics", "compose-util", "compose-preview",
    "compose-m3", "compose-m3-adaptive-nav", "compose-m-icons",
    "compose-m3-adaptive", "compose-m3-adaptive-layout", "compose-m3-adaptive-navigation",
    "compose-contrainlayout", "compose-shimmer"
]

[plugins]

kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

android-library = { id = "com.android.library", version.ref = "agp" }

publish-maven = { id = "org.gradle.maven-publish" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
